    absorption-duration: 10
    regen-duration: 5
    sound: "ITEM_TOTEM_USE"
    particle: "FLAME"

  thunder:
    enabled: true
    material: "AMETHYST_SHARD"
    custom-model-data: 103
    name: "&b&lTalizman Gromu"
    lore:
      - "&7Rzadkość: &bRzadki"
      - ""
      - "&7Działanie pasywne:"
      - "&8» &7Podczas ataku masz &b%chance%% &7szansy"
      - "&8» &7na uderzenie wroga &bpotężnym piorunem&7,"
      - "&8» &7który zadaje dodatkowe &e%damage% serca&7!"
