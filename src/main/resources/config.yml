      - "&8» &7Chroni przed śmiertelnym ciosem!"
      - "&8» &7Przywraca &e4.0 HP&7, nadaje &eRegenerację II&7,"
      - "&8» &eOdporność na Ogień &7oraz &eAbsorpcję&7."
      - ""
      - "&cCooldown: &f%cooldown%s"
      - "&eDziała, gdy znajduje się w Twoim ekwipunku."
