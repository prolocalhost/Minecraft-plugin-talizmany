settings:
  # Tryb aktywacji talizmanow:
  # INVENTORY - talizman dziala jesli gracz posiada go w dowolnym slocie eq
  # HANDS - talizman dziala tylko gdy trzymany jest w rece glownej lub dodatkowej
  activation-mode: "INVENTORY"

  # Dzwiek odtwarzany przy otwarciu katalogu GUI
  gui-sound: "UI_BUTTON_CLICK"

  # Czy powiadomienia o cooldownie aktywnego talizmanu maja wyswietlac sie na ActionBarze
  actionbar-enabled: true

# Konfiguracja poszczegolnych talizmanow
talizmany:
  vampirism:
    enabled: true
    material: "REDSTONE"
    custom-model-data: 101
    name: "&c&lTalizman Wampiryzmu"
    lore:
      - "&7Rzadkość: &cMityczny"
      - ""
      - "&7Działanie pasywne:"
      - "&8» &7Wysysa siły witalne przeciwnika podczas ciosu."
      - "&8» &c%chance%% &7szansy na uleczenie &c%heal%% &7zadanych obrażeń!"
      - ""
      - "&eDziała, gdy znajduje się w Twoim ekwipunku."
    chance: 35.0
    heal-percent: 25.0
    sound: "ENTITY_PLAYER_BURP"
    particle: "DAMAGE_INDICATOR"

  phoenix:
    enabled: true
    material: "TOTEM_OF_UNDYING"
    custom-model-data: 102
    name: "&6&lTalizman Feniksa"
    lore:
      - "&7Rzadkość: &6Legendarny"
      - ""
