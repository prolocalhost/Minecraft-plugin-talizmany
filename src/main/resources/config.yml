  titan:
    enabled: true
    material: "IRON_INGOT"
    custom-model-data: 105
    name: "&8&lTalizman Tytana"
    lore:
      - "&7Rzadkość: &8Epicki"
      - ""
      - "&7Działanie pasywne:"
      - "&8» &7Gdy Twoje zdrowie spadnie poniżej &c30%&7,"
      - "&8» &7otrzymujesz &9Odporność II (Resistance) &7na &e%duration%s&7!"
      - ""
