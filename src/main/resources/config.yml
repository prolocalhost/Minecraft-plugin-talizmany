    material: "FEATHER"
    custom-model-data: 104
    name: "&f&lTalizman Wiatru"
    lore:
      - "&7Rzadkość: &fEpicki"
      - ""
      - "&7Działanie aktywne (&ePPM&7):"
      - "&8» &7Wystrzeliwuje Cię z ogromną prędkością"
      - "&8» &7w kierunku, w który patrzysz!"
      - "&8» &7Chroni przed obrażeniami od upadku po skoku."
      - ""
